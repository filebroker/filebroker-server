name: filebroker

x-env-files: &env-files
  - path: ./.env
    required: false
  - path: ./.env.secret
    required: false
  - path: ./.env.local
    required: false
  - path: ./.env.docker
    required: false

services:
  filebroker-db:
    image: postgres:18
    restart: unless-stopped
    profiles:
      - local-db

    env_file: *env-files

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 15

    volumes:
      - postgres-data:/var/lib/postgresql

  filebroker-server:
    build:
      context: .

    restart: unless-stopped
    stop_grace_period: 4h

    env_file: *env-files

    healthcheck:
      test:
        - CMD-SHELL
        - 'curl --fail --silent "http://127.0.0.1:$${FILEBROKER_API_PORT}/health" > /dev/null'
      start_period: 30m
      start_interval: 5s
      interval: 30s
      timeout: 2s
      retries: 3

    volumes:
      - ./logs/docker:/opt/filebroker-server/logs

    depends_on:
      filebroker-db:
        condition: service_healthy
        required: false

    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    build:
      context: ../filebroker-client

    restart: unless-stopped

    env_file: *env-files

    environment:
      FILEBROKER_API_UPSTREAMS: >-
        server filebroker-server:${FILEBROKER_API_PORT:-8080} resolve;

    depends_on:
      filebroker-server:
        condition: service_healthy

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - thumb-cache:/data/nginx/thumb_cache

volumes:
  postgres-data:
  thumb-cache:
